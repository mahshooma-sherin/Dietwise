<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ea374" />
      <stop offset="100%" stop-color="#214f38" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1c2b24" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="#e6efe4" />

  <!-- DietWise stylized leaf mark -->
  <g filter="url(#shadow)">
    <!-- Primary leaf -->
    <path d="M32 10 C46 10 52 24 52 36 C52 48 40 52 28 52 C28 36 22 24 32 10 Z" fill="url(#leafGrad)" />
    <!-- Secondary small leaf shoot -->
    <path d="M28 36 C20 36 14 30 14 22 C22 22 26 28 28 36 Z" fill="#5aa37c" />
    <!-- Central leaf vein -->
    <path d="M28 50 C31 38 37 26 44 18" stroke="#fbfcfa" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85" />
  </g>
</svg>
